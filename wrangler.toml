# Cloudflare Worker — testopencode
#
# Port dari Flask + SQLite + Jinja2 (repo `hafazahh/testopencode`, 43 route,
# 13 tabel) ke Workers + D1.
#
# D1 dibuat 2026-10-24 via `wrangler d1 create testopencode-db` (region APAC).
# Custom domain diatur lewat DASHBOARD, bukan lewat `routes` di file ini —
# menambah `routes` tidak bisa diandalkan mengaktifkan routing custom domain
# (lihat skill `cloudflare-worker-api`). Target domain: crud.choirulhaq.com
# (cutover setelah user menyetujui; Render lama dilepas lebih dulu).

name = "testopencode-worker"
main = "src/index.ts"
compatibility_date = "2026-10-24"

# D1 — port dari database.db (SQLite) di repo Flask.
[[d1_databases]]
binding = "DB"
database_name = "testopencode-db"
database_id = "016434ea-d911-4825-b20d-128df18c826b"

[vars]
# "production" untuk deploy sungguhan (session cookie dapat atribut Secure).
# "local" hanya untuk `wrangler dev`.
ENVIRONMENT = "production"
SITE_URL = "https://testopencode-worker.choirulhaq.workers.dev"

# Aset statis (CSS + JS) — direferensikan render.ts sebagai /style.css, /confirm.js,
# /margin.js, /pembelian.js, /penjualan.js, /kartu-stok.js, /favicon.svg.
# Tanpa binding ini semua URL itu 404 dan UI tampil tanpa gaya.
[assets]
directory = "./static"
